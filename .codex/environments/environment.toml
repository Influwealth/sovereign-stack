# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "sovereign-stack"

[setup]
script = '''
# Navigate into the new worktree
cd "$CODEX_WORKTREE_PATH"

# Install Node dependencies if present
if (Test-Path package.json) {
  npm install
}

# Install Python dependencies if present
if (Test-Path requirements.txt) {
  pip install -r requirements.txt
}

# DeepFlex runtime setup
if (Test-Path deepflex/setup.ps1) {
  ./deepflex/setup.ps1
}

# WealthBridge OS setup
if (Test-Path wealthbridge-os/setup.ps1) {
  ./wealthbridge-os/setup.ps1
}

# Capsule bootstrap (optional)
if (Test-Path scripts/capsule-bootstrap.ps1) {
  ./scripts/capsule-bootstrap.ps1
}
'''

[cleanup]
script = '''
# Shut down docker services if present
if (Test-Path docker-compose.yml) {
  docker compose down --remove-orphans
}

# Remove caches
if (Test-Path .cache) {
  Remove-Item -Recurse -Force .cache
}

# Remove temp folders
if (Test-Path tmp) {
  Remove-Item -Recurse -Force tmp
}
'''

[[actions]]
name = "Dev Server"
icon = "tool"
command = "npm run dev"

[[actions]]
name = "Build"
icon = "tool"
command = "npm run build"

[[actions]]
name = "Tests"
icon = "tool"
command = "npm test"

[[actions]]
name = "DeepFlex Start"
icon = "tool"
command = "powershell ./deepflex/start.ps1"

[[actions]]
name = "WealthBridge Start"
icon = "tool"
command = "powershell ./wealthbridge-os/start.ps1"

[[actions]]
name = "SAP Tests"
icon = "tool"
command = "npm run sap:test"
